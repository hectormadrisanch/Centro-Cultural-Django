<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Actividad</title>
</head>
<body>
    <h1>¿Eliminar actividad?</h1>
    <p>¿Estás seguro de que quieres borrar la actividad <strong>"{{ actividad.nombre }}"</strong>?</p>
    <p>Esta acción no se puede deshacer.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Sí, eliminar</button>
    </form>

    <br>
    <a href="{% url 'lista_actividades' %}">Cancelar y volver</a>
</body>
</html>
